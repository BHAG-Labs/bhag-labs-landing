<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="BHAG Labs — construction">
  <title>BHAG Labs — overlapping discs with tangent spine, construction</title>
  <defs>
    <clipPath id="top-disc-constr-v7">
      <circle cx="118" cy="88" r="30"/>
    </clipPath>
  </defs>
  <rect width="520" height="400" fill="#f1ebe1"/>

  <g transform="translate(132, 80)">
    <g stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.35">
      <circle cx="118" cy="88" r="30"/>
      <circle cx="130" cy="140" r="44"/>
      <line x1="118" y1="88" x2="130" y2="140" stroke-dasharray="2 3"/>
      <line x1="118" y1="88" x2="88.03" y2="86.95"/>
      <line x1="130" y1="140" x2="86.04" y2="138.47"/>
      <line x1="118" y1="50" x2="118" y2="200" stroke-dasharray="1.5 2.5" opacity="0.5"/>
    </g>

    <circle cx="130" cy="140" r="44" fill="#c1502e"/>
    <circle cx="118" cy="88" r="30" fill="#1a1a1a"/>
    <circle cx="130" cy="140" r="44" fill="#3d5a4a" clip-path="url(#top-disc-constr-v7)"/>
    <line x1="89.7" y1="44" x2="83.9" y2="194"
          stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>

    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.8">
      <circle cx="118" cy="88" r="2.4"/>
      <circle cx="130" cy="140" r="2.4"/>
      <circle cx="88.03" cy="86.95" r="2.2"/>
      <circle cx="86.04" cy="138.47" r="2.2"/>
    </g>

    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="128" y="86"  font-size="11" font-weight="500" fill="#f1ebe1">O₁</text>
      <text x="138" y="143" font-size="11" font-weight="500" fill="#f1ebe1">O₂</text>
      <text x="78"  y="83"  font-size="10" font-weight="500" text-anchor="end">T₁</text>
      <text x="76"  y="135" font-size="10" font-weight="500" text-anchor="end">T₂</text>
      <text x="105" y="93"  font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">r</text>
      <text x="111" y="128" font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">R</text>
      <text x="129" y="118" font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">d</text>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="260" y="340" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">OVERLAPPING  DISCS  ·  TANGENT  SPINE</text>
    <text x="260" y="362" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">d &lt; R + r  (overlap exists)    sin θ = (R − r) / d  (tangent lean)</text>
    <text x="260" y="380" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55" font-style="italic">spine leans on the discs at T₁ and T₂. the small cream triangle between is the negative space.</text>
  </g>
</svg>
