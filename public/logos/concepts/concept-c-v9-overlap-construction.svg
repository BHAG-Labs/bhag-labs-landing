<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="BHAG Labs construction">
  <title>BHAG Labs construction v9</title>
  <defs>
    <clipPath id="top-disc-constr-v9">
      <circle cx="141" cy="102" r="32"/>
    </clipPath>
  </defs>
  <rect width="520" height="400" fill="#f1ebe1"/>

  <g transform="translate(108, 68)">
    <!-- Construction lines -->
    <g stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.3">
      <circle cx="141" cy="102" r="32"/>
      <circle cx="139" cy="154" r="40"/>
      <line x1="141" y1="102" x2="139" y2="154" stroke-dasharray="2 3"/>
      <!-- Gap indicators -->
      <line x1="104" y1="102" x2="109" y2="102" stroke-dasharray="1 1.5" opacity="0.6"/>
      <line x1="94" y1="154" x2="99" y2="154" stroke-dasharray="1 1.5" opacity="0.6"/>
    </g>

    <!-- Rendered mark -->
    <line x1="82" y1="191" x2="106" y2="65"
          stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="139" cy="154" r="40" fill="#c1502e"/>
    <circle cx="141" cy="102" r="32" fill="#1a1a1a"/>
    <circle cx="139" cy="154" r="40" fill="#2a4942" clip-path="url(#top-disc-constr-v9)"/>

    <!-- Key-point dots -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.8">
      <circle cx="141" cy="102" r="2.4"/>
      <circle cx="139" cy="154" r="2.4"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="152" y="100" font-size="11" font-weight="500" fill="#f1ebe1">O1</text>
      <text x="150" y="157" font-size="11" font-weight="500" fill="#f1ebe1">O2</text>
      <text x="164" y="82"  font-size="10" font-weight="400" opacity="0.6">r=32</text>
      <text x="172" y="140" font-size="10" font-weight="400" opacity="0.6">R=40</text>
      <text x="105" y="98"  font-size="9"  font-weight="400" opacity="0.5">~5px</text>
      <text x="95"  y="150" font-size="9"  font-weight="400" opacity="0.5">~5px</text>
      <text x="74"  y="60"  font-size="9"  font-weight="400" opacity="0.45">~11&#176;</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="260" y="332" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">TILTED  B  &#183;  SEPARATE  STEM  &#183;  V9</text>
    <text x="260" y="354" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">r=32  R=40  overlap &#8776; 20    stem stroke 10    equal gap &#8776; 5px each side</text>
    <text x="260" y="376" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55" font-style="italic">stem behind discs, not touching. rightward lean. forest #2a4942.</text>
  </g>
</svg>
