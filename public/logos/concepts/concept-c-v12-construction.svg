<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="BHAG Labs construction v12">
  <title>BHAG Labs construction v12</title>
  <defs>
    <clipPath id="v12c-clip">
      <circle cx="151" cy="84" r="48"/>
    </clipPath>
  </defs>
  <rect width="560" height="460" fill="#f1ebe1"/>

  <g transform="translate(120, 56)">
    <!-- Construction guides -->
    <g stroke="#1a1a1a" stroke-width="0.5" fill="none" opacity="0.25">
      <circle cx="151" cy="84" r="48"/>
      <circle cx="144" cy="164" r="60"/>
      <line x1="151" y1="84" x2="144" y2="164" stroke-dasharray="2 3"/>
      <!-- Stem centre-line extended (dashed) -->
      <line x1="50" y1="232" x2="114" y2="16" stroke-dasharray="2 3" opacity="0.5"/>
      <!-- Perpendicular from top centre to stem (radius to T1) -->
      <line x1="151" y1="84" x2="98.27" y2="68.99"/>
      <!-- Perpendicular from bottom centre to stem (drops short of stem by gap) -->
      <line x1="144" y1="164" x2="76.97" y2="144.92"/>
      <!-- Disc-bottom baseline -->
      <line x1="20" y1="224" x2="220" y2="224" stroke-dasharray="1 3"/>
    </g>

    <!-- Rendered mark -->
    <line x1="54" y1="217" x2="111" y2="26"
          stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <circle cx="144" cy="164" r="60" fill="#c1502e"/>
    <circle cx="151" cy="84" r="48" fill="#1a1a1a"/>
    <circle cx="144" cy="164" r="60" fill="#2a4942" clip-path="url(#v12c-clip)"/>

    <!-- Centre dots + tangent / near-tangent points -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.7">
      <circle cx="151" cy="84" r="2.5"/>
      <circle cx="144" cy="164" r="2.5"/>
      <circle cx="98.27" cy="68.99" r="2"/>
    </g>
    <!-- Near-foot on bottom: stem-side endpoint (inside stem stroke) shown faintly -->
    <g fill="#1a1a1a" opacity="0.4">
      <circle cx="76.97" cy="144.92" r="1.5"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="162" y="82"  font-size="11" font-weight="500" fill="#f1ebe1">O1</text>
      <text x="156" y="167" font-size="11" font-weight="500" fill="#f1ebe1">O2</text>
      <text x="124" y="76"  font-size="10" font-weight="400" opacity="0.55" fill="#f1ebe1">r=48</text>
      <text x="180" y="148" font-size="10" font-weight="400" opacity="0.55">R=60</text>
      <text x="93"  y="64"  font-size="9"  font-weight="500" opacity="0.7" fill="#1a1a1a" text-anchor="end">T1 (tangent)</text>
      <text x="72"  y="142" font-size="9"  font-weight="500" opacity="0.55" fill="#1a1a1a" text-anchor="end">gap &#8776; 4</text>
      <text x="50"  y="14"  font-size="9"  font-weight="400" opacity="0.45">stem &#952; &#8776; 16.5&#176;</text>
      <text x="222" y="221" font-size="9"  font-weight="400" opacity="0.45" text-anchor="end">baseline y=224</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="280" y="376" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">BHAG  LABS  &#183;  V12  &#183;  FINAL</text>
    <text x="280" y="400" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">tangent to top disc &#183; ~4 px gap to bottom &#183; cap sits on disc baseline &#183; stroke 14 round caps</text>
    <text x="280" y="422" font-size="11" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55">80 sin &#952; &#8722; 7 cos &#952; = 12 + g    &#8658;    &#952; &#8776; 16.5&#176; for g = 4    (g = 0 recovers v11 dual tangency)</text>
    <text x="280" y="444" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.45" font-style="italic">the stem rests on the upper bowl and breathes past the lower one. a sliver of cream separates spine from base.</text>
  </g>
</svg>
