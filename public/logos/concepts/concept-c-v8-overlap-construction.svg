<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="BHAG Labs construction">
  <title>BHAG Labs construction v8</title>
  <defs>
    <clipPath id="top-disc-constr-v8">
      <circle cx="118" cy="86" r="28"/>
    </clipPath>
  </defs>
  <rect width="520" height="400" fill="#f1ebe1"/>

  <g transform="translate(132, 80)">
    <!-- Construction lines -->
    <g stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.35">
      <circle cx="118" cy="86" r="28"/>
      <circle cx="130" cy="140" r="44"/>
      <!-- Centre line -->
      <line x1="118" y1="86" x2="130" y2="140" stroke-dasharray="2 3"/>
      <!-- Radius to T1 -->
      <line x1="118" y1="86" x2="90.1" y2="83.9"/>
      <!-- Radius to T2 -->
      <line x1="130" y1="140" x2="86.1" y2="136.7"/>
      <!-- Vertical reference -->
      <line x1="118" y1="48" x2="118" y2="200" stroke-dasharray="1.5 2.5" opacity="0.5"/>
    </g>

    <!-- Rendered mark -->
    <circle cx="130" cy="140" r="44" fill="#c1502e"/>
    <circle cx="118" cy="86" r="28" fill="#1a1a1a"/>
    <circle cx="130" cy="140" r="44" fill="#3d5a4a" clip-path="url(#top-disc-constr-v8)"/>
    <line x1="92.9" y1="46" x2="82.0" y2="192"
          stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>

    <!-- Key-point dots -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.8">
      <circle cx="118" cy="86" r="2.4"/>
      <circle cx="130" cy="140" r="2.4"/>
      <circle cx="90.1" cy="83.9" r="2.2"/>
      <circle cx="86.1" cy="136.7" r="2.2"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="128" y="84"  font-size="11" font-weight="500" fill="#f1ebe1">O1</text>
      <text x="138" y="143" font-size="11" font-weight="500" fill="#f1ebe1">O2</text>
      <text x="80"  y="81"  font-size="10" font-weight="500" text-anchor="end">T1</text>
      <text x="76"  y="133" font-size="10" font-weight="500" text-anchor="end">T2</text>
      <text x="106" y="82"  font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">r=28</text>
      <text x="110" y="126" font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">R=44</text>
      <text x="130" y="117" font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">d&#8776;55.3</text>
      <text x="96" y="42" font-size="9" font-weight="400" opacity="0.50">&#8776;4.3&#176;</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="260" y="332" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">OVERLAPPING  DISCS  &#183;  TANGENT  SPINE  &#183;  V8</text>
    <text x="260" y="354" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">d &lt; R + r  (overlap)    sin &#952; = (R &#8722; r) / d  (lean)    r/R = 28/44 &#8776; 0.64  (B ratio)</text>
    <text x="260" y="376" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55" font-style="italic">smaller top disc: more lean, better B proportions. spine stroke 10, round caps.</text>
  </g>
</svg>
