<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BHAG Labs">
  <title>BHAG Labs — Overlapping Discs with Tangent Spine</title>
  <defs>
    <clipPath id="top-disc-v7">
      <circle cx="118" cy="88" r="30"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" fill="#f1ebe1"/>

  <!-- Bottom disc: R = 44 -->
  <circle cx="130" cy="140" r="44" fill="#c1502e"/>

  <!-- Top disc: r = 30 -->
  <circle cx="118" cy="88" r="30" fill="#1a1a1a"/>

  <!-- Lens of overlap: bottom disc redrawn in forest, clipped by top disc.
       This is exactly the intersection of both discs — no missed pixels. -->
  <circle cx="130" cy="140" r="44" fill="#3d5a4a" clip-path="url(#top-disc-v7)"/>

  <!-- Spine: common external tangent on the LEFT of both discs.
       Leans on each disc at exactly one point (T₁ ≈ (88, 87), T₂ ≈ (86, 138)).
       sin θ = (R − r) / d  with d = √(12² + 52²) ≈ 53.4  ⇒  θ ≈ 15° offset from centre-line,
       which itself tilts ~13° from vertical (top disc shifted left of bottom). Net stem tilt ≈ 2°.
       Round caps, extends past both tangent points so it visibly "rests on" the disc cluster. -->
  <line x1="89.7" y1="44" x2="83.9" y2="194"
        stroke="#1a1a1a" stroke-width="12" stroke-linecap="round"/>
</svg>
