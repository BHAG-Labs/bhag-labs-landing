<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" role="img" aria-label="BHAG Labs — common external tangent construction">
  <title>BHAG Labs — common external tangent construction</title>
  <rect width="520" height="360" fill="#f1ebe1"/>

  <!-- Centre the construction at (260, 160) of canvas; mark coords use offset (+134, +66) from logo space -->
  <g transform="translate(134, 66)">
    <!-- Hairline guide circles (full outlines) -->
    <g stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.35">
      <circle cx="140" cy="94" r="30"/>
      <circle cx="126" cy="170" r="42"/>
      <!-- Centre-to-centre line, dashed -->
      <line x1="140" y1="94" x2="126" y2="170" stroke-dasharray="2 3"/>
      <!-- Right tangent (the one we DON'T use as the stem) -->
      <line x1="164" y1="76" x2="166" y2="167" stroke-dasharray="3 3"/>
      <!-- Vertical reference at top tangent point, to anchor the angle θ -->
      <line x1="112" y1="60" x2="112" y2="100" stroke-dasharray="1.5 2.5"/>
    </g>

    <!-- The arc showing angle θ between vertical reference and stem -->
    <path d="M112 90 a18 18 0 0 0 5.94 14.78"
          stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.55"/>

    <!-- The filled mark on top of guides -->
    <circle cx="126" cy="170" r="42" fill="#c1502e"/>
    <circle cx="140" cy="94" r="30" fill="#1a1a1a"/>
    <line x1="116" y1="72" x2="80" y2="175"
          stroke="#1a1a1a" stroke-width="11" stroke-linecap="round"/>

    <!-- Tangent points T₁, T₂ (where the stem touches each disc) -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.8">
      <circle cx="112" cy="84" r="2.4"/>
      <circle cx="87" cy="156" r="2.4"/>
    </g>

    <!-- Centre dots O₁, O₂ -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.8">
      <circle cx="140" cy="94" r="2.4"/>
      <circle cx="126" cy="170" r="2.4"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="150" y="92" font-size="11" font-weight="500">O₁</text>
      <text x="136" y="170" font-size="11" font-weight="500" fill="#f1ebe1">O₂</text>
      <text x="100" y="80" font-size="10" font-weight="500" text-anchor="end">T₁</text>
      <text x="78" y="156" font-size="10" font-weight="500" text-anchor="end">T₂</text>
      <text x="124" y="106" font-size="10" font-weight="500" opacity="0.7">θ</text>
      <text x="148" y="138" font-size="10" font-weight="500" opacity="0.7" transform="rotate(-10 148 138)">d</text>
      <text x="158" y="86" font-size="9.5" font-weight="500" opacity="0.7">r</text>
      <text x="105" y="190" font-size="9.5" font-weight="500" opacity="0.7" fill="#f1ebe1">R</text>
    </g>
  </g>

  <!-- Caption -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="260" y="316" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">COMMON  EXTERNAL  TANGENT</text>
    <text x="260" y="336" font-size="10.5" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.65">sin θ = (R − r) / d  —  the lean is forced by the radius gap</text>
  </g>
</svg>
