<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BHAG Labs">
  <title>BHAG Labs v9</title>
  <defs>
    <clipPath id="top-disc-v9">
      <circle cx="141" cy="102" r="32"/>
    </clipPath>
  </defs>
  <rect width="256" height="256" fill="#f1ebe1"/>

  <!-- Stem: separate from discs, ~5px gap each side, stroke 10, lean ~11 deg right -->
  <line x1="82" y1="191" x2="106" y2="65"
        stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>

  <!-- Bottom disc (lower bowl): R=40, terracotta -->
  <circle cx="139" cy="154" r="40" fill="#c1502e"/>

  <!-- Top disc (upper bowl): r=32, charcoal -->
  <circle cx="141" cy="102" r="32" fill="#1a1a1a"/>

  <!-- Lens: overlap in forest, clipped to top disc -->
  <circle cx="139" cy="154" r="40" fill="#2a4942" clip-path="url(#top-disc-v9)"/>
</svg>
