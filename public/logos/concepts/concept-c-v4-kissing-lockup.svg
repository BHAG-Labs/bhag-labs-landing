<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="BHAG Labs">
  <title>BHAG Labs — Tangent-Kissing Circles lockup</title>

  <!-- Mark: scaled into a 176×176 slot -->
  <g transform="translate(8,12) scale(0.6875)">
    <circle cx="128" cy="146" r="46" fill="#c1502e"/>
    <circle cx="128" cy="70" r="30" fill="#1a1a1a"/>
    <line x1="104" y1="40" x2="71" y2="192"
          stroke="#1a1a1a" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Wordmark: lowercase, tight, single weight -->
  <g transform="translate(212,118)">
    <text font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="600" font-size="78" letter-spacing="-3" fill="#1a1a1a">bhag labs</text>
    <text x="3" y="34" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="500" font-size="12" letter-spacing="3.5" fill="#1a1a1a" opacity="0.55">KISSING  CIRCLES  ·  sin θ = (R − r) / (R + r)</text>
  </g>
</svg>
