<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" role="img" aria-label="BHAG Labs construction">
  <title>BHAG Labs construction v10</title>
  <defs>
    <clipPath id="v10c-clip">
      <circle cx="147" cy="84" r="48"/>
    </clipPath>
  </defs>
  <rect width="560" height="440" fill="#f1ebe1"/>

  <g transform="translate(120, 56)">
    <!-- Construction lines -->
    <g stroke="#1a1a1a" stroke-width="0.5" fill="none" opacity="0.25">
      <circle cx="147" cy="84" r="48"/>
      <circle cx="144" cy="164" r="60"/>
      <line x1="147" y1="84" x2="144" y2="164" stroke-dasharray="2 3"/>
      <!-- Gap indicators (horizontal ticks) -->
      <line x1="93" y1="84" x2="99" y2="84" opacity="0.5"/>
      <line x1="78" y1="164" x2="84" y2="164" opacity="0.5"/>
      <!-- 5:4 ratio annotation arc -->
      <path d="M147 84 L99 84" stroke-dasharray="1.5 2" opacity="0.3"/>
      <path d="M144 164 L84 164" stroke-dasharray="1.5 2" opacity="0.3"/>
    </g>

    <!-- Rendered mark -->
    <line x1="59" y1="230" x2="97" y2="26"
          stroke="#1a1a1a" stroke-width="14" stroke-linecap="butt"/>
    <circle cx="144" cy="164" r="60" fill="#c1502e"/>
    <circle cx="147" cy="84" r="48" fill="#1a1a1a"/>
    <circle cx="144" cy="164" r="60" fill="#2a4942" clip-path="url(#v10c-clip)"/>

    <!-- Centre dots -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.7">
      <circle cx="147" cy="84" r="2.5"/>
      <circle cx="144" cy="164" r="2.5"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="158" y="82"  font-size="11" font-weight="500" fill="#f1ebe1">O1</text>
      <text x="156" y="167" font-size="11" font-weight="500" fill="#f1ebe1">O2</text>
      <text x="118" y="76"  font-size="10" font-weight="400" opacity="0.55" fill="#f1ebe1">r=48</text>
      <text x="180" y="148" font-size="10" font-weight="400" opacity="0.55">R=60</text>
      <text x="100" y="80"  font-size="9"  font-weight="400" opacity="0.4">~6px</text>
      <text x="84"  y="160" font-size="9"  font-weight="400" opacity="0.4">~6px</text>
      <text x="50"  y="22"  font-size="9"  font-weight="400" opacity="0.4">~10.6&#176;</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="280" y="360" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">BHAG  LABS  &#183;  V10  &#183;  FINAL</text>
    <text x="280" y="384" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">R : r = 5 : 4    overlap &#8776; 28    stem lean &#8776; 10.6&#176;    stroke 14    butt caps</text>
    <text x="280" y="406" font-size="11" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55">light: forest #2a4942 lens on cream    dark: ochre #c89b27 lens on charcoal</text>
    <text x="280" y="426" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.45" font-style="italic">stem separate, equal gap, flat ends. the lean is visible in the cut.</text>
  </g>
</svg>
