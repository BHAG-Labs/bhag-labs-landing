<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" role="img" aria-label="BHAG Labs — overlapping-discs construction">
  <title>BHAG Labs — overlapping-discs construction</title>
  <rect width="520" height="380" fill="#f1ebe1"/>

  <g transform="translate(132, 60)">
    <!-- Hairline guides -->
    <g stroke="#1a1a1a" stroke-width="0.6" fill="none" opacity="0.35">
      <circle cx="118" cy="88" r="30"/>
      <circle cx="130" cy="140" r="44"/>
      <!-- Centre-to-centre segment, dashed -->
      <line x1="118" y1="88" x2="130" y2="140" stroke-dasharray="2 3"/>
      <!-- Radical axis (the line containing both intersection points) -->
      <line x1="93" y1="111.34" x2="150" y2="98.18" stroke-dasharray="3 3"/>
      <!-- Radii to the two intersection points -->
      <line x1="118" y1="88" x2="97.77" y2="110.10"/>
      <line x1="130" y1="140" x2="97.77" y2="110.10"/>
    </g>

    <!-- Filled mark on top -->
    <circle cx="130" cy="140" r="44" fill="#c1502e"/>
    <circle cx="118" cy="88" r="30" fill="#1a1a1a"/>
    <path fill="#3d5a4a" d="M97.77 110.10 A30 30 0 0 1 145.83 98.99 A44 44 0 0 1 97.77 110.10 Z"/>
    <line x1="102" y1="50" x2="91" y2="170"
          stroke="#1a1a1a" stroke-width="14" stroke-linecap="butt"/>

    <!-- Centres O₁, O₂, intersection points P₁, P₂ -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.8">
      <circle cx="118" cy="88"  r="2.4"/>
      <circle cx="130" cy="140" r="2.4"/>
      <circle cx="97.77"  cy="110.10" r="2.2"/>
      <circle cx="145.83" cy="98.99"  r="2.2"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="128" y="86"  font-size="11" font-weight="500" fill="#f1ebe1">O₁</text>
      <text x="138" y="143" font-size="11" font-weight="500" fill="#f1ebe1">O₂</text>
      <text x="88"  y="106" font-size="10" font-weight="500" text-anchor="end">P₁</text>
      <text x="155" y="98"  font-size="10" font-weight="500">P₂</text>
      <text x="125" y="120" font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">d</text>
      <text x="108" y="95"  font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">r</text>
      <text x="111" y="128" font-size="10" font-weight="500" opacity="0.65" fill="#f1ebe1">R</text>
    </g>
  </g>

  <!-- Caption -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="260" y="316" font-size="11" font-weight="600" letter-spacing="3" text-anchor="middle">OVERLAPPING  DISCS</text>
    <text x="260" y="338" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">d(O₁, O₂) &lt; R + r   ⇒   the discs intersect at two points P₁, P₂</text>
    <text x="260" y="358" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55" font-style="italic">the lens between the two arcs is where the BHAG is born — coloured separately to mark it</text>
  </g>
</svg>
