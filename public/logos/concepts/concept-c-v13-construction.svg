<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="BHAG Labs construction v13">
  <title>BHAG Labs construction v13</title>
  <defs>
    <clipPath id="v13c-clip"><circle cx="151" cy="84" r="48"/></clipPath>
  </defs>
  <rect width="560" height="460" fill="#f1ebe1"/>

  <g transform="translate(120, 56)">
    <!-- Guides -->
    <g stroke="#1a1a1a" stroke-width="0.5" fill="none" opacity="0.25">
      <circle cx="151" cy="84" r="48"/>
      <circle cx="144" cy="164" r="60"/>
      <line x1="151" y1="84" x2="144" y2="164" stroke-dasharray="2 3"/>
      <line x1="46" y1="232" x2="122" y2="16" stroke-dasharray="2 3" opacity="0.5"/>
      <line x1="151" y1="84" x2="93.79" y2="63.21"/>
      <line x1="144" y1="164" x2="75.18" y2="139.46"/>
      <line x1="20" y1="224" x2="220" y2="224" stroke-dasharray="1 3"/>
    </g>

    <!-- Mark -->
    <line x1="49" y1="217" x2="119" y2="26"
          stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <circle cx="144" cy="164" r="60" fill="#c1502e"/>
    <circle cx="151" cy="84" r="48" fill="#1a1a1a"/>
    <circle cx="144" cy="164" r="60" fill="#2a4942" clip-path="url(#v13c-clip)"/>

    <!-- Centre + foot points -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.7">
      <circle cx="151" cy="84" r="2.5"/>
      <circle cx="144" cy="164" r="2.5"/>
      <circle cx="93.79" cy="63.21" r="2"/>
    </g>
    <g fill="#1a1a1a" opacity="0.4">
      <circle cx="75.18" cy="139.46" r="1.5"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="162" y="82"  font-size="11" font-weight="500" fill="#f1ebe1">O1</text>
      <text x="156" y="167" font-size="11" font-weight="500" fill="#f1ebe1">O2</text>
      <text x="124" y="76"  font-size="10" font-weight="400" opacity="0.55" fill="#f1ebe1">r=48</text>
      <text x="180" y="148" font-size="10" font-weight="400" opacity="0.55">R=60</text>
      <text x="86"  y="58"  font-size="9"  font-weight="500" opacity="0.7" fill="#1a1a1a" text-anchor="end">overlap o=5</text>
      <text x="70"  y="136" font-size="9"  font-weight="500" opacity="0.55" fill="#1a1a1a" text-anchor="end">gap g=4</text>
      <text x="50"  y="14"  font-size="9"  font-weight="400" opacity="0.45">stem &#952; &#8776; 20.2&#176;</text>
      <text x="222" y="221" font-size="9"  font-weight="400" opacity="0.45" text-anchor="end">baseline y=224</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="280" y="376" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">BHAG  LABS  &#183;  V13  &#183;  FINAL</text>
    <text x="280" y="400" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">stem &amp; top disc share one colour, one shape &#183; gap to bottom disc &#183; lens = product-market fit</text>
    <text x="280" y="422" font-size="11" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55">80 sin &#952; &#8722; 7 cos &#952; = (R + 7 + g) &#8722; (r + 7 &#8722; o) = 21    &#8658;    &#952; &#8776; 20.2&#176; for o=5, g=4</text>
    <text x="280" y="444" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.45" font-style="italic">the founder &amp; the launchpad are one mass. the market is a different shape. where they meet is the magic.</text>
  </g>
</svg>
