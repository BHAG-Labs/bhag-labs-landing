<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-label="BHAG Labs construction v11">
  <title>BHAG Labs construction v11</title>
  <defs>
    <clipPath id="v11c-clip">
      <circle cx="151" cy="84" r="48"/>
    </clipPath>
  </defs>
  <rect width="560" height="460" fill="#f1ebe1"/>

  <g transform="translate(120, 56)">
    <!-- Construction guides -->
    <g stroke="#1a1a1a" stroke-width="0.5" fill="none" opacity="0.25">
      <circle cx="151" cy="84" r="48"/>
      <circle cx="144" cy="164" r="60"/>
      <line x1="151" y1="84" x2="144" y2="164" stroke-dasharray="2 3"/>
      <!-- Stem centre-line extended past both endpoints (dashed) -->
      <line x1="59" y1="230" x2="109" y2="26" stroke-dasharray="2 3" opacity="0.5"/>
      <!-- Perpendiculars from each disc centre to the stem (radii to tangent points) -->
      <line x1="151" y1="84" x2="103.18" y2="72.36"/>
      <line x1="144" y1="164" x2="85.72" y2="149.83"/>
      <!-- Vertical reference dropped from stem-bottom -->
      <line x1="59" y1="20" x2="59" y2="240" stroke-dasharray="1 3" opacity="0.4"/>
    </g>

    <!-- Rendered mark -->
    <line x1="59" y1="230" x2="109" y2="26"
          stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <circle cx="144" cy="164" r="60" fill="#c1502e"/>
    <circle cx="151" cy="84" r="48" fill="#1a1a1a"/>
    <circle cx="144" cy="164" r="60" fill="#2a4942" clip-path="url(#v11c-clip)"/>

    <!-- Centre dots + tangent points -->
    <g fill="#f1ebe1" stroke="#1a1a1a" stroke-width="0.7">
      <circle cx="151" cy="84" r="2.5"/>
      <circle cx="144" cy="164" r="2.5"/>
      <circle cx="103.18" cy="72.36" r="2"/>
      <circle cx="85.72" cy="149.83" r="2"/>
    </g>

    <!-- Labels -->
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
      <text x="162" y="82"  font-size="11" font-weight="500" fill="#f1ebe1">O1</text>
      <text x="156" y="167" font-size="11" font-weight="500" fill="#f1ebe1">O2</text>
      <text x="124" y="76"  font-size="10" font-weight="400" opacity="0.55" fill="#f1ebe1">r=48</text>
      <text x="180" y="148" font-size="10" font-weight="400" opacity="0.55">R=60</text>
      <text x="100" y="68"  font-size="9"  font-weight="500" opacity="0.65" fill="#1a1a1a" text-anchor="end">T1 (tangent)</text>
      <text x="82"  y="146" font-size="9"  font-weight="500" opacity="0.65" fill="#1a1a1a" text-anchor="end">T2 (tangent)</text>
      <text x="50"  y="22"  font-size="9"  font-weight="400" opacity="0.4">stem &#952; &#8776; 13.67&#176;</text>
      <text x="49"  y="248" font-size="8"  font-weight="400" opacity="0.4">x=59 fixed</text>
    </g>
  </g>

  <!-- Footer -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" fill="#1a1a1a">
    <text x="280" y="376" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">BHAG  LABS  &#183;  V11  &#183;  FINAL</text>
    <text x="280" y="400" font-size="11" font-weight="500" letter-spacing="0.5" text-anchor="middle" opacity="0.7">stem bottom fixed (59,230)    pair rotated &#8776; 2.91&#176; CW    new stem angle &#8776; 13.67&#176;    stroke 14    round caps</text>
    <text x="280" y="422" font-size="11" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.55">85 cos &#952; &#8722; 66 sin &#952; = R + 7        common external tangent of two unequal circles    sin &#966; = (R&#8722;r) / d</text>
    <text x="280" y="444" font-size="10" font-weight="400" letter-spacing="0.5" text-anchor="middle" opacity="0.45" font-style="italic">a single straight stem leans on both bowls. the bigger disc reaches further left; the smaller disc kisses higher up.</text>
  </g>
</svg>
