<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Pitchwala">
  <title>Pitchwala — The Pitcher</title>
  <rect width="256" height="256" fill="#f1ebe1"/>
  <!-- Slide stack (3 cards, fanned) -->
  <g>
    <rect x="60"  y="80"  width="120" height="120" rx="6" fill="#c89b27" transform="rotate(-9 120 140)"/>
    <rect x="68"  y="64"  width="120" height="120" rx="6" fill="#2a4942" transform="rotate(-3 128 124)"/>
    <rect x="76"  y="56"  width="120" height="120" rx="6" fill="#1a1a1a"/>
  </g>
  <!-- Lines on the top slide -->
  <rect x="92"  y="76"  width="88"  height="6" fill="#f1ebe1"/>
  <rect x="92"  y="92"  width="64"  height="4" fill="#f1ebe1" opacity="0.6"/>
  <rect x="92"  y="104" width="72"  height="4" fill="#f1ebe1" opacity="0.6"/>
  <!-- Play triangle = "pitch in motion" -->
  <path d="M120 128 L160 152 L120 176 Z" fill="#c1502e"/>
</svg>
