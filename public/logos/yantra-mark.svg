<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Yantra">
  <title>Yantra</title>
  <rect width="256" height="256" fill="#f1ebe1"/>

  <!-- Outer bezel -->
  <circle cx="128" cy="128" r="88" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Inner bezel -->
  <circle cx="128" cy="128" r="76" fill="none" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Cardinal ticks (N/E/S/W) -->
  <g stroke="#1a1a1a" stroke-width="4" stroke-linecap="butt">
    <line x1="128" y1="40" x2="128" y2="56"/>
    <line x1="128" y1="200" x2="128" y2="216"/>
    <line x1="40"  y1="128" x2="56"  y2="128"/>
    <line x1="200" y1="128" x2="216" y2="128"/>
  </g>

  <!-- Inter-cardinal minor ticks -->
  <g stroke="#1a1a1a" stroke-width="2" opacity="0.4">
    <line x1="62"  y1="62"  x2="73"  y2="73"/>
    <line x1="194" y1="62"  x2="183" y2="73"/>
    <line x1="62"  y1="194" x2="73"  y2="183"/>
    <line x1="194" y1="194" x2="183" y2="183"/>
  </g>

  <!-- Needle: tilted 11 deg from north (matching BHAG lean) -->
  <!-- 11 deg from north = pointing almost due north, slightly east -->
  <!-- Tip at 11 deg: x = 128 + 68*sin(11) = 128+13 = 141, y = 128 - 68*cos(11) = 128-66.7 = 61.3 -->
  <!-- Tail at 191 deg: x = 128 + 34*sin(191) = 128-6.5 = 121.5, y = 128 - 34*cos(191) = 128+33.4 = 161.4 -->
  <line x1="121.5" y1="161.4" x2="141" y2="61.3"
        stroke="#c1502e" stroke-width="6" stroke-linecap="butt"/>
  <circle cx="141" cy="61.3" r="5" fill="#c1502e"/>

  <!-- Tail: forest -->
  <line x1="128" y1="128" x2="121.5" y2="161.4"
        stroke="#2a4942" stroke-width="4" stroke-linecap="butt"/>

  <!-- Hub -->
  <circle cx="128" cy="128" r="10" fill="#c89b27"/>
  <circle cx="128" cy="128" r="3.5" fill="#1a1a1a"/>
</svg>
