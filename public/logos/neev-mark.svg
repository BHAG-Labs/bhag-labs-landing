<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Neev">
  <title>Neev — foundation stone</title>
  <rect width="256" height="256" fill="#f1ebe1"/>

  <!-- Imprint frame (book-series family) -->
  <rect x="22" y="22" width="212" height="212" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="30" y="30" width="196" height="196" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>

  <!-- Top caption: NEEV in letterspaced caps with flanking rules -->
  <line x1="58" y1="62" x2="100" y2="62" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="156" y1="62" x2="198" y2="62" stroke="#1a1a1a" stroke-width="0.8"/>
  <text x="128" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="11" letter-spacing="5" fill="#1a1a1a">NEEV</text>

  <!-- Apex sun -->
  <circle cx="128" cy="92" r="10" fill="#c89b27"/>

  <!-- Rising column from the foundation -->
  <rect x="120" y="106" width="16" height="32" fill="#c1502e"/>

  <!-- Three foundation stones, ascending: forest top, charcoal-mid, charcoal-base -->
  <rect x="84"  y="138" width="88"  height="20" fill="#2a4942"/>
  <rect x="64"  y="160" width="128" height="22" fill="#1a1a1a"/>
  <rect x="48"  y="184" width="160" height="26" fill="#1a1a1a"/>

  <!-- Mortar etching: faint cream lines between stones -->
  <line x1="128" y1="138" x2="128" y2="158" stroke="#f1ebe1" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="160" x2="100" y2="182" stroke="#f1ebe1" stroke-width="1" opacity="0.4"/>
  <line x1="156" y1="160" x2="156" y2="182" stroke="#f1ebe1" stroke-width="1" opacity="0.4"/>
  <line x1="80"  y1="184" x2="80"  y2="210" stroke="#f1ebe1" stroke-width="1" opacity="0.35"/>
  <line x1="128" y1="184" x2="128" y2="210" stroke="#f1ebe1" stroke-width="1" opacity="0.35"/>
  <line x1="176" y1="184" x2="176" y2="210" stroke="#f1ebe1" stroke-width="1" opacity="0.35"/>
</svg>
