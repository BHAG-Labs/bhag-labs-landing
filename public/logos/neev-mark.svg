<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Neev">
  <title>Neev</title>
  <rect width="256" height="256" fill="#f1ebe1"/>

  <!-- Three foundation blocks in golden-section widths (1 : 1.618 : 2.618)
       Base width unit = 36. Blocks: 36, 58, 94.
       All tilted ~11 deg right (matching BHAG stem lean).
       transform origin roughly at center of each block. -->
  <g transform="rotate(-11 128 148)">
    <!-- Base block: widest, charcoal -->
    <rect x="81" y="168" width="94" height="28" fill="#1a1a1a"/>
    <!-- Middle block: golden ratio, forest -->
    <rect x="99" y="134" width="58" height="28" fill="#2a4942"/>
    <!-- Top block: unit, terracotta -->
    <rect x="110" y="100" width="36" height="28" fill="#c1502e"/>
  </g>

  <!-- Apex diamond: the first stone, ochre -->
  <path d="M131 68 L139 80 L131 92 L123 80 Z" fill="#c89b27" transform="rotate(-11 131 80)"/>

  <!-- Stem: vertical discipline line along left edge, butt caps -->
  <line x1="72" y1="210" x2="84" y2="54" stroke="#1a1a1a" stroke-width="8" stroke-linecap="butt"/>
</svg>
