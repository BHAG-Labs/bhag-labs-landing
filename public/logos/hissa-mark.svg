<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Hissa">
  <title>Hissa</title>
  <rect width="256" height="256" fill="#f1ebe1"/>

  <!-- Full circle: charcoal (the whole pie) -->
  <circle cx="138" cy="128" r="72" fill="#1a1a1a"/>

  <!-- Your share: terracotta sector at golden angle (137.5 deg = 360 * (1 - 1/phi))
       Sector from 0 to 222.5 deg (= 360 - 137.5) is the larger portion.
       The smaller terracotta sector spans 137.5 deg.
       Using a path with arc commands. -->
  <path d="M138 128 L138 56
           A72 72 0 0 1 195.4 189.7 Z"
        fill="#c1502e"/>

  <!-- Chord line: the dividing cut, cream, tilted at ~11 deg -->
  <line x1="138" y1="56" x2="195.4" y2="189.7"
        stroke="#f1ebe1" stroke-width="3" stroke-linecap="butt"/>

  <!-- Centre hub: ochre dot -->
  <circle cx="138" cy="128" r="8" fill="#c89b27"/>

  <!-- Left stem: discipline line, butt caps -->
  <line x1="48" y1="218" x2="60" y2="38" stroke="#1a1a1a" stroke-width="8" stroke-linecap="butt"/>
</svg>
