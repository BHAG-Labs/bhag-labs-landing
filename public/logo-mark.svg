<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="BHAG Labs">
  <title>BHAG Labs — publisher's imprint</title>
  <rect width="256" height="256" fill="#f1ebe1"/>

  <!-- Imprint plate: thin outer frame + inner hairline (book-plate aesthetic) -->
  <rect x="22" y="22" width="212" height="212" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="30" y="30" width="196" height="196" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>

  <!-- Top decoration: two ochre rules flanking a small label -->
  <line x1="58" y1="62" x2="100" y2="62" stroke="#c89b27" stroke-width="1.2"/>
  <line x1="156" y1="62" x2="198" y2="62" stroke="#c89b27" stroke-width="1.2"/>
  <text x="128" y="66" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="9" letter-spacing="3" fill="#1a1a1a">EST · 2025</text>

  <!-- Dominant serif B (the colophon) -->
  <text x="128" y="174" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="148" fill="#1a1a1a">B</text>

  <!-- Diamond + flanking rules -->
  <line x1="58" y1="196" x2="116" y2="196" stroke="#1a1a1a" stroke-width="0.8"/>
  <line x1="140" y1="196" x2="198" y2="196" stroke="#1a1a1a" stroke-width="0.8"/>
  <path d="M128 190 L134 196 L128 202 L122 196 Z" fill="#c1502e"/>

  <!-- Wordmark caps -->
  <text x="128" y="218" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="11" letter-spacing="6" fill="#1a1a1a">BHAG · LABS</text>
</svg>
