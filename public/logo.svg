  <!-- Wordmark + tagline -->
  <g transform="translate(214,124)">
    <text font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="78" letter-spacing="-1.5" fill="#1a1a1a">BHAG <tspan fill="#c1502e">Labs</tspan>.</text>
    <text x="0" y="40" font-family="Cormorant Garamond, Georgia, serif" font-style="italic" font-weight="500" font-size="28" fill="#2a4942">an editorial venture for Indian founders</text>
  </g>
