<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" role="img" aria-label="BHAG Labs">
  <title>BHAG Labs</title>

  <!-- Compact imprint mark on the left -->
  <g transform="translate(8,12)">
    <rect x="0" y="0" width="176" height="176" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="6" y="6" width="164" height="164" fill="none" stroke="#1a1a1a" stroke-width="0.6"/>
    <line x1="22" y1="32" x2="56" y2="32" stroke="#c89b27" stroke-width="1"/>
    <line x1="120" y1="32" x2="154" y2="32" stroke="#c89b27" stroke-width="1"/>
    <text x="88" y="35" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="7" letter-spacing="2.5" fill="#1a1a1a">EST · 2025</text>
    <text x="88" y="124" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-weight="900" font-size="108" fill="#1a1a1a">B</text>
    <line x1="22" y1="140" x2="76" y2="140" stroke="#1a1a1a" stroke-width="0.7"/>
    <line x1="100" y1="140" x2="154" y2="140" stroke="#1a1a1a" stroke-width="0.7"/>
    <path d="M88 134 L93 140 L88 146 L83 140 Z" fill="#c1502e"/>
    <text x="88" y="158" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="9" letter-spacing="4.5" fill="#1a1a1a">BHAG · LABS</text>
